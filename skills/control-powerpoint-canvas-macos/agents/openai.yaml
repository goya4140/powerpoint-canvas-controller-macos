interface:
  display_name: "Control PowerPoint Canvas on macOS"
  short_description: "Draw and inspect editable slides in PowerPoint for Mac."
  default_prompt: "Use $control-powerpoint-canvas-macos to build this slide live with editable PowerPoint objects on macOS."

dependencies:
  tools:
    - type: "mcp"
      value: "powerpoint-live"
      description: "Live editable PowerPoint canvas operations through the macOS Office Add-in bridge."
      transport: "stdio"
    - type: "mcp"
      value: "powerpoint-file-utils"
      description: "PowerPoint inspection, validation, saving, and export."
      transport: "stdio"

policy:
  allow_implicit_invocation: true
